name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under (latest, next, beta)
        required: false
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Syntax check
        run: node --check client.js && node --check index.js
      - name: Contract test
        run: node test/contract.test.mjs
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.tag }}
